<!--
  `[searchable]` —— 窄屏(S 段起)关掉搜索输入框, 换来三条用户明确要的行为:
    ① 点**整块**容器 = `toggle()`: 展开、**再点收起**(ng-select 的 handleMousedown:
       `if (searchable()) { open() } else { toggle() }`);
    ② 输入框只读 ⇒ 全程不弹软键盘;
    ③ 不再需要"只能靠输入一个字符才弹出面板"那个别扭路径。
  ⚠️ 反面: `searchable = true` 时"再点一次"只会 `open()`(已是开着的 no-op),
  所以永远收不起来 —— 用户报的"点箭头展开后无法再点箭头关闭"就是这个。
  桌面端保持可搜索(那里没有软键盘, 长列表更需要输入过滤)。
-->
<!--
  ⚠️ 第十七批(U 段): 展开时机 = **松手**(pointerup), 不是按下(pointerdown)。
  pointerdown 只负责 `preventDefault()`(掐掉兼容 mouse 事件), 见 ts 里
  `onFieldPointerdown()` / `onFieldPointerup()` 的注释 —— 两者必须成对。
-->
<div
  class="tw-relative tw-w-full"
  (pointerdown)="onFieldPointerdown($event)"
  (pointerup)="onFieldPointerup($event)"
>
  <ng-select
    [ngModel]="selectedOption()"
    (ngModelChange)="onChange($event)"
    [disabled]="disabled"
    [placeholder]="placeholder()"
    [items]="items()"
    [searchable]="!narrow()"
    (blur)="onBlur()"
    [labelForId]="searchInputId()"
    [clearable]="false"
    (open)="onOpen()"
    (close)="onClose()"
    appendTo="body"
    outsideClickEvent="mousedown"
    [keyDownFn]="onKeyDown"
    [attr.aria-label]="selectedOption()?.label ?? placeholder()"
  >
    <ng-template ng-option-tmp let-item="item">
      <div class="tw-flex tw-justify-between tw-items-center" [title]="item.label">
        <div class="tw-flex tw-gap-2 tw-flex-1 tw-min-w-0">
          <div class="tw-flex-initial tw-self-center">
            @if (item.icon != null) {
              <bit-icon [name]="item.icon" fixedWidth />
            }
          </div>
          <div class="tw-flex tw-flex-col tw-min-w-0">
            <div
              bitTypography="body2"
              class="tw-leading-5 tw-flex-1 tw-text-ellipsis tw-overflow-hidden"
            >
              {{ item.label }}
            </div>
            @if (item.description) {
              <div bitTypography="helper" class="tw-text-fg-body tw-font-normal tw-truncate">
                {{ item.description }}
              </div>
            }
          </div>
        </div>
        @if (item.metaData) {
          <div bitTypography="helper">
            {{ item.metaData }}
          </div>
        }
      </div>
    </ng-template>
  </ng-select>

  <!--
    自托管定制(第十六批/T 段): 这里原来并排放着一个 44px 宽的透明热点按钮
    `<button class="warden-select-open">`(第十四批加的, 目的是"点最右侧箭头即展开")。

    **已删除**, 原因是它是错的解法: 它在 `<ng-select>` **外面**, 而 ng-select 判"外部点击"
    只比 `this._select.contains($event.target)`(ng-select-ng-select.mjs 的 `_checkToClose`),
    且它自己的模板里绑着 `(outsideClick)="close()"`
    (`<ng-dropdown-panel … (outsideClick)="close()">`) ⇒ 按这个按钮会被判成"点了外面":
    "pointerdown 里 toggle 开一次 + outsideClick 关一次" = 面板只闪一下就没了。

    能力没有丢: 现在由包装 div 上的 `(pointerdown)`(`onFieldPointerdown()`)接管,
    **整块**控件(含最右侧那块箭头区)按下去都能展开; 窄屏再按一次收起。
    为什么这样就不会误判成外部点击: 事件目标是 `<ng-select>` 内部的元素。
  -->
</div>
