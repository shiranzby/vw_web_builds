<!--
  窄屏底部标签栏。标记结构有意与 L4 注入的那份保持一致（同一个 id / class / data-tab），
  这样 `tests/mobile-regression.mjs` 的「F1 底栏 6 项」那条断言不需要改。

  ⚠️ 标签文案是**中文字面量**，没有走 i18n，这是刻意的：
     1) 这是 L4 上你验收过的视觉稿，迁移的验收标准是「功能等价」；
     2) 上游 i18n 里没有合适的短键 —— `send` 在 zh_CN 里根本**没翻译**（仍是 "Send"），
        而验证码只有 `verificationCodeTotp` =「验证码 (TOTP)」，放进 11px 的标签太长。
     如果以后要 i18n 化，先补这两个键，再把下面的字面量换成 `| i18n`。
-->
<nav id="warden-tabbar" class="warden-tabbar">
  <a
    routerLink="/vault"
    data-tab="vault"
    [class.warden-tab-active]="isActive('vault')"
    [attr.aria-current]="isActive('vault') ? 'page' : null"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3l7 2.6v5.3c0 4.3-3 8.2-7 9.5-4-1.3-7-5.2-7-9.5V5.6L12 3z" />
    </svg>
    <span>密码库</span>
  </a>

  <!--
    「验证码」：L4 里它也是指向 /vault（`{ route: "/vault", auth: true }`），再由
    `openAuthView()` 在密码库页上盖一层自注入的验证码视图 —— 也就是说它的**目标路由**
    本来就和我们这里一致。

    那一层视图是 J16（独立「验证码」页）要迁的东西，尚未落地，所以这里暂时只做导航、
    不点亮选中态（`isActive('totp')` 在 /totp 路由出现前恒为 false）。
    J16 落地后把这个 routerLink 改成 /totp 即可，选中态会自己生效。
  -->
  <a routerLink="/vault" data-tab="totp" [class.warden-tab-active]="isActive('totp')">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.3" />
      <path d="M12 7.4V12l3.1 1.9" />
    </svg>
    <span>验证码</span>
  </a>

  <a
    routerLink="/sends"
    data-tab="sends"
    [class.warden-tab-active]="isActive('sends')"
    [attr.aria-current]="isActive('sends') ? 'page' : null"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4.2 11.9 20 4.6l-7.3 15.8-2.1-6.4-6.4-2.1z" />
    </svg>
    <span>发送</span>
  </a>

  <a
    routerLink="/tools"
    data-tab="tools"
    [class.warden-tab-active]="isActive('tools')"
    [attr.aria-current]="isActive('tools') ? 'page' : null"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4" y="4" width="7" height="7" rx="1.6" />
      <rect x="13" y="4" width="7" height="7" rx="1.6" />
      <rect x="4" y="13" width="7" height="7" rx="1.6" />
      <rect x="13" y="13" width="7" height="7" rx="1.6" />
    </svg>
    <span>工具</span>
  </a>

  <a
    routerLink="/reports"
    data-tab="reports"
    [class.warden-tab-active]="isActive('reports')"
    [attr.aria-current]="isActive('reports') ? 'page' : null"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5.5 20V11M12 20V4.5M18.5 20v-6" />
    </svg>
    <span>报告</span>
  </a>

  <a
    routerLink="/settings"
    data-tab="settings"
    [class.warden-tab-active]="isActive('settings')"
    [attr.aria-current]="isActive('settings') ? 'page' : null"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3" />
      <path
        d="M12 3.6v2.1M12 18.3v2.1M3.6 12h2.1M18.3 12h2.1M6.1 6.1l1.5 1.5M16.4 16.4l1.5 1.5M17.9 6.1l-1.5 1.5M7.6 16.4l-1.5 1.5"
      />
    </svg>
    <span>设置</span>
  </a>
</nav>
