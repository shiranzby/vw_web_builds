<!--
  `warden-bare-header`: 自托管定制(S 段)的钩子 —— 窄屏把整个页头(含左上角「Send」
  标题)藏掉, 给内容让出纵向空间。用**类名 + CSS** 而不是删模板: 桌面端要保留标题,
  而且删模板会连带影响投影进来的「新增」按钮与无障碍标题。见 vaultwarden.css 的 S2。
-->
<app-header class="warden-bare-header">
  @if (!disableSend()) {
    <tools-new-send-dropdown></tools-new-send-dropdown>
  }
</app-header>

@if (disableSend()) {
  <bit-callout type="warning" title="{{ 'sendDisabled' | i18n }}">
    {{ "sendDisabledWarning" | i18n }}
  </bit-callout>
}

<div>
  <tools-send-list
    [sends]="filteredSends()"
    [loading]="loading()"
    [disableSend]="disableSend()"
    [listState]="listState()"
    [searchText]="currentSearchText()"
    [hasAnySends]="hasAnySends()"
    (editSend)="editSend($event)"
    (copySend)="onCopySend($event)"
    (deleteSend)="deleteSend($event)"
    (removePassword)="onRemovePassword($event)"
  >
    <!-- Hide the filters if a single type of Send is allowed -->
    <div class="tw-mt-4 warden-send-filters" slot="filters">
      @if (allowedSendTypes().length !== 1) {
        <bit-toggle-group
          [selected]="selectedToggleValue"
          (selectedChange)="onToggleChange($event)"
          [label]="'filterSends' | i18n"
        >
          <bit-toggle [value]="'all'">{{ "allSends" | i18n }}</bit-toggle>
          <bit-toggle [value]="'text'">{{ "sendTypeText" | i18n }}</bit-toggle>
          <bit-toggle [value]="'file'">{{ "sendTypeFile" | i18n }}</bit-toggle>
        </bit-toggle-group>
      }
      <!--
        第十八批/V 段: 切换行最右侧的「新增 Send」入口(窄屏专用, 宽屏由页头那颗负责)。
        起因: 页头在窄屏被 `warden-bare-header` 藏掉, 而列表里那个居中的「新增」只在
        **空列表**时出现 —— 一旦有内容就没有任何新增入口了。放在这里既有入口、
        又能在「所有/文本/文件」之间来回切时始终可见。
      -->
      @if (!disableSend()) {
        <tools-new-send-dropdown class="warden-send-filters-new" [hideIcon]="true">
        </tools-new-send-dropdown>
      }
    </div>
    @if (!disableSend()) {
      <tools-new-send-dropdown [hideIcon]="true" slot="empty-button"></tools-new-send-dropdown>
    }
  </tools-send-list>
</div>
